[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-app"
version = "1.2.0"
description = "Домашняя работа по DevOps: заметки с CI/CD и мониторингом"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "prometheus-client>=0.20",
    "gunicorn>=21.2",
]

[tool.setuptools.packages.find]
include = ["notes_app*"]

[tool.setuptools.package-data]
notes_app = ["static/*"]
